<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Amber radial glow -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <!-- Golden-Amber gradient for the emblem badge -->
    <linearGradient id="crGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="15%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Dark inner container gradient -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241e17"/>
      <stop offset="100%" stop-color="#14110d"/>
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="32" cy="32" r="31" fill="url(#amberGlow)"/>

  <!-- Dark Base Shield for High Contrast in Light/Dark Browser Tabs -->
  <rect x="7" y="7" width="50" height="50" rx="15" fill="url(#darkBg)"/>

  <!-- Golden-Amber Rounded Square Badge -->
  <rect x="9" y="9" width="46" height="46" rx="13" fill="url(#crGoldGrad)" filter="url(#badgeShadow)"/>
  <!-- Crisp Inner Bevel Highlight -->
  <rect x="10" y="10" width="44" height="44" rx="12" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2"/>

  <!-- High-Contrast Obsidian Monogram "CR" -->
  <text
    x="32"
    y="42"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="25"
    font-weight="900"
    fill="#120f0c"
    text-anchor="middle"
    letter-spacing="-1.2"
  >CR</text>
</svg>
