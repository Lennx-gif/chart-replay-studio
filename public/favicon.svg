<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Solid Dark Base Shield for High Contrast across Dark and Light Browser Tabs -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="#14120e" stroke="#2a241b" stroke-width="2"/>
  <rect x="5" y="5" width="54" height="54" rx="12" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Bearish Candlestick (Rose/Coral) -->
  <line x1="21" y1="18" x2="21" y2="44" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
  <rect x="18" y="24" width="6" height="14" rx="1.5" fill="#f43f5e"/>

  <!-- Bullish Candlestick (Emerald) -->
  <line x1="33" y1="14" x2="33" y2="46" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <rect x="30" y="19" width="6" height="18" rx="1.5" fill="#10b981"/>

  <!-- Golden-Amber Replay Loop Arc -->
  <path
    d="M 23 13 A 22 22 0 1 1 11 36"
    stroke="#f59e0b"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Forward Replay Arrowhead -->
  <polygon points="26,8 26,18 35,13" fill="#f59e0b"/>

  <!-- Playback Badge -->
  <circle cx="46" cy="46" r="9" fill="#201a14" stroke="#f59e0b" stroke-width="1.5"/>
  <polygon points="44,41.5 44,50.5 50.5,46" fill="#f59e0b"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Background Tile with Nubian Theme Dark Background -->
  <rect width="64" height="64" rx="14" fill="#18130e"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#3d2c18" stroke-width="2"/>
  
  <!-- Left Bullish Candle (Green/Gold) -->
  <!-- Upper & Lower Wick -->
  <line x1="20" y1="12" x2="20" y2="48" stroke="#d4a54a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Candle Body -->
  <rect x="15" y="20" width="10" height="20" rx="2" fill="#d4a54a"/>

  <!-- Right Bearish Candle (Coral/Red) -->
  <!-- Upper & Lower Wick -->
  <line x1="36" y1="18" x2="36" y2="52" stroke="#e05347" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Candle Body -->
  <rect x="31" y="26" width="10" height="18" rx="2" fill="#e05347"/>

  <!-- Replay Play Symbol Overlay (Bottom Right) -->
  <circle cx="48" cy="48" r="12" fill="#d4a54a"/>
  <polygon points="45,42 54,48 45,54" fill="#18130e"/>
</svg>
