[package]
name = "chart-replay-studio"
version = "0.1.0"
description = "A local-first Forex replay and backtesting desktop application"
authors = ["Lennx"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "chart_replay_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.6" }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
